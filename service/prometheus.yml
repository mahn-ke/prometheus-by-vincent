global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Auto-discover containers via Docker socket; scrapes those opted-in with label prometheus.scrape=true
  # Only containers on the prometheus-by-vincent_internal network are reachable and considered
  - job_name: 'docker-containers'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: network
            values: ['prometheus-by-vincent_internal']
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__address__, __meta_docker_container_label_prometheus_port]
        action: replace
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      - source_labels: [__meta_docker_container_label_prometheus_path]
        action: replace
        regex: '(.+)'
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_name]
        target_label: container
