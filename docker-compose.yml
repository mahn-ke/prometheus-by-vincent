#http
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OAUTH_URL}
      - --client-id=${OAUTH_CLIENT_ID}
      - --client-secret=${OAUTH_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --session-store-type=redis
      - --redis-connection-url=redis://valkey:6379
      - --cookie-secure=true
      - --http-address=0.0.0.0:4180
      - --upstream=http://prometheus:9090
      - --redirect-url=https://prometheus.by.vincent.mahn.ke/oauth2/callback
      - --email-domain=*
      - --skip-provider-button=true
      - --reverse-proxy=true
      # Accept Keycloak-issued service-account JWTs (aud must match --client-id)
      - --skip-jwt-bearer-tokens=true
      # Allow CORS preflight requests (OPTIONS) from local Perses
      - --skip-auth-preflight=true
    ports:
      - "9090:4180"
    depends_on:
      - valkey
    networks:
      - internal
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - no
    networks:
      - internal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
      - --web.cors.origin=http://127\.0\.0\.1:.*
    volumes:
      - data:/prometheus
      - ./service/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    devices:
      - /dev/kmsg
    networks:
      - internal
    restart: unless-stopped

volumes:
  data:

networks:
  internal:
